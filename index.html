<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf8f3" />
    <title>Ippo 一歩 · 一步一步學日文</title>
    <meta
      name="description"
      content="給完全新手的日文課：五十音、單字、句型、會話與測驗，每一句都能聽發音。用手機一步一步學會簡單的日文會話。"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ippo" />
    <script>
      // Mirrors applySettings() in src/state.ts. It has to run before the first
      // paint, or opening the app in dark mode flashes the light paper.
      try {
        const saved = JSON.parse(localStorage.getItem("ippo.settings") || "null");
        // Stores are written as { v, data }; saves from before versioning are bare objects.
        const s = (saved && (saved.data || saved)) || {};
        const theme =
          s.theme === "light" || s.theme === "dark"
            ? s.theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.textSize = s.textSize === "large" || s.textSize === "xlarge" ? s.textSize : "standard";
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#16171b" : "#fbf8f3";
      } catch {}
    </script>
  </head>
  <body>
    <div id="app" class="mx-auto min-h-dvh max-w-md"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
